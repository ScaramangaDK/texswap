<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TexSwap</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0e1116;
    color: #94a0b8;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* full-bleed loading artwork (ui/loading.png) - removes itself if absent */
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .wrap {
    position: relative;
    text-align: center;
    padding: 26px 44px;
    border-radius: 16px;
    background: rgba(14, 17, 22, 0.62);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
  }
  body.nobg .wrap { background: none; box-shadow: none; }
  .wrap img {
    width: 280px;
    max-width: 70vw;
    filter: drop-shadow(0 0 24px rgba(255, 140, 26, 0.25));
  }
  .msg {
    margin-top: 22px;
    font-size: 14px;
    letter-spacing: 0.04em;
  }
  .dots::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }
  .bar {
    margin: 16px auto 0;
    width: 220px;
    height: 3px;
    background: #232c3e;
    border-radius: 2px;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 40%;
    background: #ff8c1a;
    border-radius: 2px;
    animation: slide 1.2s ease-in-out infinite alternate;
  }
  .credit {
    margin-top: 18px;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #5f6b82;
  }
  .credit b { color: #ffa94d; font-weight: 600; }
  @keyframes slide {
    from { transform: translateX(-60%); }
    to { transform: translateX(340%); }
  }
</style>
</head>
<body>
  <img id="bg" src="loading.png" alt="" onerror="this.remove(); document.body.classList.add('nobg')">
  <div class="wrap">
    <img src="logo2-ui.png" alt="TexSwap">
    <div class="msg dots">Starting up</div>
    <div class="bar"><span></span></div>
    <div class="credit">by <b>Ralle</b></div>
  </div>
</body>
</html>
