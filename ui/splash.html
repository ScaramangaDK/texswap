<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TexSwap</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0e1116;
    color: #94a0b8;
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 22px 12px;
    box-sizing: border-box;
  }
  .logo {
    width: 100%;
    filter: drop-shadow(0 0 22px rgba(255, 140, 26, 0.22));
  }
  .status {
    margin-top: 10px;
    font-size: 12.5px;
    letter-spacing: 0.05em;
    min-height: 16px;
  }
  .status .dots::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
    /* fixed-width slot so the centered text never shifts as dots count up */
    display: inline-block;
    width: 1.3em;
    text-align: left;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }
  .bar {
    margin-top: 7px;
    width: 100%;
    height: 5px;
    background: #232c3e;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
  }
  .bar span {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff8c1a, #ffa94d);
    border-radius: 3px;
  }
  .credit {
    margin-top: 9px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #5f6b82;
  }
  .credit b { color: #ffa94d; font-weight: 600; }
</style>
</head>
<body>
  <img class="logo" src="texswaplogo-splash.png" alt="TexSwap">
  <div class="status"><span id="stext" class="dots">Starting engine</span></div>
  <div class="bar" id="bar"><span id="fill"></span></div>
  <div class="credit">by <b>Ralle</b></div>
  <script>
    // The bar always FILLS left-to-right, driven by rAF with one numeric
    // source of truth - no computed-style reads, so it can never jump back.
    // Self-fills with nothing to load; real scan progress takes over when it
    // arrives, and finishTo() completes it to 100%.
    const fill = document.getElementById('fill');
    const stext = document.getElementById('stext');
    let cur = 0;
    let from = 0;
    let target = 0;
    let dur = 1;
    let t0 = 0;
    let raf = 0;
    let iv = 0;
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / dur);
      cur = from + (target - from) * k;
      fill.style.width = cur + '%';
      if (k >= 1) {
        cancelAnimationFrame(raf);
        clearInterval(iv);
        iv = 0;
      }
      return k;
    };
    const loop = () => {
      if (step() < 1) raf = requestAnimationFrame(loop);
    };
    const goTo = (pct, ms) => {
      cancelAnimationFrame(raf);
      clearInterval(iv);
      from = cur;
      target = Math.max(cur, Math.min(100, pct)); // never backwards
      dur = Math.max(50, ms);
      t0 = performance.now();
      raf = requestAnimationFrame(loop);
      // safety net: keep advancing even if rAF is throttled (occluded window)
      iv = setInterval(step, 250);
    };
    // gentle self-fill from the start, capped so it never looks done early
    goTo(88, 4200);

    // electron-main pushes progress here while it warms the install
    window.setProgress = (phase, done, total) => {
      if (total > 0) {
        stext.className = '';
        stext.textContent = `${phase}…  ${done} / ${total}`;
        goTo(done / total * 100, 300);
      } else {
        stext.className = 'dots';
        stext.textContent = phase;
      }
    };
    window.finishTo = ms => goTo(100, ms);
  </script>
</body>
</html>
