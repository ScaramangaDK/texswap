<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ralle's AQ2 Texture Swapper</title>
  <link rel="icon" type="image/png" href="logo-mark.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div id="hookArea"></div>
    <div class="dirbar">
      <input id="dirInput" type="text" spellcheck="false" placeholder="Path to AQ2 install (root or game dir)">
      <button id="browseBtn" title="Pick your AQ2 folder">Browse…</button>
      <button id="helpBtn" title="Which folder should I pick?">?</button>
      <button id="rescanBtn" title="Rescan the install">Rescan</button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main>
    <aside id="sidebar">
      <button id="aboutBtn" class="sidelogo" title="About Ralle's AQ2 Texture Swapper">
        <img src="logo2-ui.png" alt="Ralle's AQ2 Texture Swapper">
      </button>
      <div class="sidehead">
        <input id="mapSearch" type="search" placeholder="Filter maps…">
        <span id="mapCount" class="count"></span>
      </div>
      <ul id="mapList"></ul>
    </aside>

    <section id="content">
      <div id="empty" class="empty">
        <p>Scanning…</p>
      </div>
      <div id="mapView" class="hidden">
        <div class="maphead">
          <div class="maptitle">
            <h2 id="mapName"></h2>
            <span id="mapTitle" class="subtitle"></span>
            <span id="mapMeta" class="meta"></span>
          </div>
          <div class="headactions">
            <button id="view3dBtn" title="Fly through the map with your swaps applied — click a wall to swap its texture">🧊 3D view</button>
            <button id="gameBtn" title="Launch the real game on this map — perfect lighting, your cfg, presets auto-apply">🎮 View in game</button>
            <button id="mapLightBtn" title="Per-map lighting override">📍 Map lighting</button>
            <button id="resetMapBtn" class="danger hidden">Reset map</button>
            <div class="skycard" id="skyCard" title="Click to change the skybox">
              <img id="skyThumb" alt="skybox">
              <div>
                <span class="skylabel">skybox</span>
                <span id="skyName"></span>
                <span id="skySwapInfo" class="skyswap"></span>
              </div>
            </div>
          </div>
        </div>
        <div id="presetRow" class="presetrow"></div>
        <div class="controls">
          <input id="texSearch" type="search" placeholder="Filter textures…">
          <select id="sortSel">
            <option value="area">Sort: most visible area</option>
            <option value="faces">Sort: most faces</option>
            <option value="name">Sort: name</option>
          </select>
          <label class="check"><input id="showUtility" type="checkbox"> show utility/sky surfaces</label>
          <label class="check" title="Preview the original .wal/.pcx files - what you see in-game with hi-res world textures off"><input id="lowRes" type="checkbox"> low-res (.wal) previews</label>
          <span id="texCount" class="count"></span>
        </div>
        <div id="grid" class="grid"></div>
      </div>
    </section>
  </main>

  <footer>
    Click any texture to replace it — changes are written as <code>link</code> cfgs the game applies on map load.
  </footer>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="modal" class="modal"></div>
  </div>
  <div id="toasts"></div>
  <input type="file" id="importFile" accept=".json,application/json" class="hidden">

  <div id="viewerOverlay" class="hidden">
    <canvas id="viewerCanvas"></canvas>
    <div class="vtop">
      <span id="vMapName" class="mono"></span>
      <span id="vHover" class="vhover mono"></span>
      <label class="vbright" title="Viewer brightness (lightmap intensity)">☀ <input type="range" id="vBright" min="0.5" max="12" step="0.25"></label>
      <button id="vClose">✕ close (Esc)</button>
    </div>
    <div class="vhelp">drag = look around · WASD move · Q/E down/up · Shift fast · click a surface to select its texture</div>
    <div id="vSelected" class="vsel hidden">
      <span id="vSelName" class="mono"></span>
      <button id="vSwapBtn" class="primary">Swap this texture…</button>
      <button id="vSelClose">✕</button>
    </div>
  </div>

  <script src="main.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
