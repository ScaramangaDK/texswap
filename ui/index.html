<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AQ2 Texture Swapper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">AQ2</span>
      <div>
        <h1>Texture Swapper</h1>
        <span class="tagline">milestone 2 — swap &amp; apply via softlinks</span>
      </div>
    </div>
    <div id="hookArea"></div>
    <div class="dirbar">
      <input id="dirInput" type="text" spellcheck="false" placeholder="Path to AQ2 install (root or game dir)">
      <button id="browseBtn" title="Pick your AQ2 folder">Browse…</button>
      <button id="helpBtn" title="Which folder should I pick?">?</button>
      <button id="rescanBtn" title="Rescan the install">Rescan</button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main>
    <aside id="sidebar">
      <div class="sidehead">
        <input id="mapSearch" type="search" placeholder="Filter maps…">
        <span id="mapCount" class="count"></span>
      </div>
      <ul id="mapList"></ul>
    </aside>

    <section id="content">
      <div id="empty" class="empty">
        <p>Scanning…</p>
      </div>
      <div id="mapView" class="hidden">
        <div class="maphead">
          <div class="maptitle">
            <h2 id="mapName"></h2>
            <span id="mapTitle" class="subtitle"></span>
            <span id="mapMeta" class="meta"></span>
          </div>
          <div class="headactions">
            <button id="mapLightBtn" title="Per-map lighting override">📍 Map lighting</button>
            <button id="resetMapBtn" class="danger hidden">Reset map</button>
            <div class="skycard" id="skyCard" title="Click to change the skybox">
              <img id="skyThumb" alt="skybox">
              <div>
                <span class="skylabel">skybox</span>
                <span id="skyName"></span>
                <span id="skySwapInfo" class="skyswap"></span>
              </div>
            </div>
          </div>
        </div>
        <div id="presetRow" class="presetrow"></div>
        <div class="controls">
          <input id="texSearch" type="search" placeholder="Filter textures…">
          <select id="sortSel">
            <option value="area">Sort: most visible area</option>
            <option value="faces">Sort: most faces</option>
            <option value="name">Sort: name</option>
          </select>
          <label class="check"><input id="showUtility" type="checkbox"> show utility/sky surfaces</label>
          <span id="texCount" class="count"></span>
        </div>
        <div id="grid" class="grid"></div>
      </div>
    </section>
  </main>

  <footer>
    Click any texture to replace it — changes are written as <code>link</code> cfgs the game applies on map load.
  </footer>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="modal" class="modal"></div>
  </div>
  <div id="toasts"></div>
  <input type="file" id="importFile" accept=".json,application/json" class="hidden">

  <script src="main.js"></script>
</body>
</html>
